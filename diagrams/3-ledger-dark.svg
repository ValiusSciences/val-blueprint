<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 488" role="img" aria-label="One request leaves a chain of records, each written before the act" font-size="13"><defs><marker id="ledger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">One request leaves a chain of records, each written before the act</text><text x="24" y="50" font-size="11.5" fill="#9198a1">Every box is a table. Arrows point from a record to the records it creates.</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M248 116H272" marker-end="url(#ledger-arrow)"></path><path d="M488 116H512" marker-end="url(#ledger-arrow)"></path><path d="M620 152V180H380V208" marker-end="url(#ledger-arrow)"></path><path d="M272 244H248" marker-end="url(#ledger-arrow)"></path><path d="M488 244H512" marker-end="url(#ledger-arrow)"></path><path d="M380 280V336" marker-end="url(#ledger-arrow)"></path><path d="M488 372H512" marker-end="url(#ledger-arrow)"></path><path d="M140 336V308H300V280" marker-end="url(#ledger-arrow)"></path></g><g><rect x="32" y="80" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="44" y="104" font-weight="600" fill="#e6edf3">Inbox</text><text x="44" y="120" font-size="11.5" fill="#9198a1">every chat and webhook event</text><text x="44" y="136" font-size="11.5" fill="#9198a1">once: source, id, payload hash</text></g><g><rect x="272" y="80" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="284" y="104" font-weight="600" fill="#e6edf3">Conversation</text><text x="284" y="120" font-size="11.5" fill="#9198a1">one per thread, one owner</text><text x="284" y="136" font-size="11.5" fill="#9198a1">scope frozen at its start</text></g><g><rect x="512" y="80" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="524" y="104" font-weight="600" fill="#e6edf3">Request</text><text x="524" y="120" font-size="11.5" fill="#9198a1">objective and pinned inputs</text><text x="524" y="136" font-size="11.5" fill="#9198a1">waits for a free slot</text></g><g><rect x="32" y="208" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="44" y="232" font-weight="600" fill="#e6edf3">Operations outbox</text><text x="44" y="248" font-size="11.5" fill="#9198a1">one row per outside write</text><text x="44" y="264" font-size="11.5" fill="#9198a1">intent, then receipt</text></g><g><rect x="272" y="208" width="216" height="72" rx="8" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-width="2"></rect><text x="284" y="232" font-weight="600" fill="#e6edf3">Analysis run</text><text x="284" y="248" font-size="11.5" fill="#e6edf3">one VM, a lease and an epoch</text><text x="284" y="264" font-size="11.5" fill="#e6edf3">revision n; a follow-up is n+1</text></g><g><rect x="512" y="208" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="524" y="232" font-weight="600" fill="#e6edf3">Stage ledgers</text><text x="524" y="248" font-size="11.5" fill="#9198a1">one row per long step: create,</text><text x="524" y="264" font-size="11.5" fill="#9198a1">launch, verify, publish, stop</text></g><g><rect x="32" y="336" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="44" y="360" font-weight="600" fill="#e6edf3">Incident</text><text x="44" y="376" font-size="11.5" fill="#9198a1">one per failure fingerprint</text><text x="44" y="392" font-size="11.5" fill="#9198a1">names the runs it affects</text></g><g><rect x="272" y="336" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="284" y="360" font-weight="600" fill="#e6edf3">Publication</text><text x="284" y="376" font-size="11.5" fill="#9198a1">the pull request and the exact</text><text x="284" y="392" font-size="11.5" fill="#9198a1">reviewed head it may merge at</text></g><g><rect x="512" y="336" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="524" y="360" font-weight="600" fill="#e6edf3">Feedback</text><text x="524" y="376" font-size="11.5" fill="#9198a1">a score per published revision</text><text x="524" y="392" font-size="11.5" fill="#9198a1">append-only, requester only</text></g><text x="500" y="172" text-anchor="middle" font-size="11.5" fill="#9198a1">admitted and launched</text><text x="220" y="300" text-anchor="middle" font-size="11.5" fill="#9198a1">groups what failed</text><g><rect x="32" y="424" width="696" height="40" rx="8" fill="rgba(110, 118, 129, 0.18)" stroke="#6e7681" stroke-width="1.25"></rect><text x="380" y="449" text-anchor="middle" fill="#e6edf3">Audit events: every privileged action, who acted and when</text></g></svg>
