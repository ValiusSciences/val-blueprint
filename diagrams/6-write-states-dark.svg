<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 310" role="img" aria-label="An uncertain write is settled, never retried" font-size="13"><defs><marker id="write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">An uncertain write is settled, never retried</text><text x="24" y="52" font-size="11.5" fill="#9198a1">An operation never returns to pending, and nothing uncertain is retried by a worker.</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M144 130H172" marker-end="url(#write-arrow)"></path><path d="M292 130H320" marker-end="url(#write-arrow)"></path><path d="M440 130H456" marker-end="url(#write-arrow)"></path><path d="M600 130H616" marker-end="url(#write-arrow)"></path><path d="M380 154V226" marker-end="url(#write-arrow)"></path><path d="M528 166V226" marker-end="url(#write-arrow)"></path><path d="M588 250H676V154" marker-end="url(#write-arrow)"></path><path d="M468 250H440" marker-end="url(#write-arrow)"></path><path d="M232 154V190H84V154" marker-end="url(#write-arrow)"></path></g><g><rect x="24" y="106" width="120" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="84" y="134" text-anchor="middle" font-weight="600" fill="#e6edf3">Pending</text></g><g><rect x="172" y="106" width="120" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="232" y="134" text-anchor="middle" font-weight="600" fill="#e6edf3">Leased</text></g><g><rect x="320" y="106" width="120" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="380" y="134" text-anchor="middle" font-weight="600" fill="#e6edf3">Started</text></g><g><polygon points="456,130 528,94 600,130 528,166" fill="none" stroke="#6e7681" stroke-width="1.25"></polygon><text x="528" y="134" text-anchor="middle" fill="#e6edf3">Outcome known?</text></g><g><rect x="616" y="106" width="120" height="48" rx="8" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="2"></rect><text x="676" y="134" text-anchor="middle" font-weight="600" fill="#e6edf3">Succeeded</text></g><g><rect x="320" y="226" width="120" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="380" y="254" text-anchor="middle" font-weight="600" fill="#e6edf3">Cancelled</text></g><g><rect x="468" y="226" width="120" height="48" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-width="2"></rect><text x="528" y="254" text-anchor="middle" font-weight="600" fill="#e6edf3">Uncertain</text></g><text x="158" y="92" text-anchor="middle" font-size="11.5" fill="#9198a1">claim, 60 s lease</text><text x="306" y="92" text-anchor="middle" font-size="11.5" fill="#9198a1">recheck, write intent</text><text x="454" y="92" text-anchor="middle" font-size="11.5" fill="#9198a1">the call</text><text x="602" y="92" text-anchor="middle" font-size="11.5" fill="#9198a1">receipt</text><text x="390" y="194" font-size="11.5" fill="#9198a1">guard refused it</text><text x="538" y="198" font-size="11.5" fill="#9198a1">response lost,</text><text x="538" y="212" font-size="11.5" fill="#9198a1">or the worker died</text><text x="684" y="206" font-size="11.5" fill="#9198a1">settled</text><text x="454" y="282" text-anchor="middle" font-size="11.5" fill="#9198a1">settled</text><text x="158" y="204" text-anchor="middle" font-size="11.5" fill="#9198a1">lease expired, never started</text></svg>
