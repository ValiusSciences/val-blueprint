<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 428" role="img" aria-label="A request becomes a reviewed, reproduced pull request" font-size="13"><defs><marker id="journey-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">A request becomes a reviewed, reproduced pull request</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M184 116H208" marker-end="url(#journey-arrow)"></path><path d="M368 116H392" marker-end="url(#journey-arrow)"></path><path d="M552 116H576" marker-end="url(#journey-arrow)"></path><path d="M656 144V186H104V228" marker-end="url(#journey-arrow)"></path><path d="M184 256H216" marker-end="url(#journey-arrow)"></path><path d="M360 256H392" marker-end="url(#journey-arrow)"></path><path d="M552 256H576" marker-end="url(#journey-arrow)"></path><path d="M288 292V348" marker-end="url(#journey-arrow)"></path><path d="M736 256H744V68H288V88" marker-end="url(#journey-arrow)"></path></g><g><rect x="24" y="88" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="104" y="112" text-anchor="middle" font-weight="600" fill="#1f2328">Ask in a thread</text><text x="104" y="128" text-anchor="middle" font-size="11.5" fill="#59636e">one agent per thread</text></g><g><rect x="208" y="88" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="288" y="112" text-anchor="middle" font-weight="600" fill="#1f2328">Start an analysis</text><text x="288" y="128" text-anchor="middle" font-size="11.5" fill="#59636e">fresh, isolated VM</text></g><g><rect x="392" y="88" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="472" y="112" text-anchor="middle" font-weight="600" fill="#1f2328">Run and ask back</text><text x="472" y="128" text-anchor="middle" font-size="11.5" fill="#59636e">answers and files</text></g><g><rect x="576" y="88" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="656" y="112" text-anchor="middle" font-weight="600" fill="#1f2328">In-session review</text><text x="656" y="128" text-anchor="middle" font-size="11.5" fill="#59636e">2 rounds, Claude Opus</text></g><g><rect x="24" y="228" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="104" y="252" text-anchor="middle" font-weight="600" fill="#1f2328">Independent rerun</text><text x="104" y="268" text-anchor="middle" font-size="11.5" fill="#59636e">no data network</text></g><g><polygon points="216,256 288,220 360,256 288,292" fill="none" stroke="#8c959f" stroke-width="1.25"></polygon><text x="288" y="260" text-anchor="middle" fill="#1f2328">Reproduced?</text></g><g><rect x="392" y="228" width="160" height="56" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"></rect><text x="472" y="252" text-anchor="middle" font-weight="600" fill="#1f2328">Publish</text><text x="472" y="268" text-anchor="middle" font-size="11.5" fill="#1f2328">PR + Slack summary</text></g><g><rect x="576" y="228" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="656" y="252" text-anchor="middle" font-weight="600" fill="#1f2328">Follow up, merge</text><text x="656" y="268" text-anchor="middle" font-size="11.5" fill="#59636e">or rate it, close it</text></g><g><rect x="208" y="348" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="288" y="372" text-anchor="middle" font-weight="600" fill="#1f2328">Draft PR</text><text x="288" y="388" text-anchor="middle" font-size="11.5" fill="#59636e">a person decides</text></g><text x="376" y="248" text-anchor="middle" font-size="11.5" fill="#59636e">yes</text><text x="298" y="320" font-size="11.5" fill="#59636e">no</text><text x="516" y="60" text-anchor="middle" font-size="11.5" fill="#59636e">a follow-up revises the same pull request</text></svg>
