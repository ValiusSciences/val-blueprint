<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 798" role="img" aria-label="Only the control plane writes to Slack and GitHub" font-size="13"><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">Only the control plane writes to Slack and GitHub</text><text x="24" y="52" font-size="11.5" fill="#9198a1">Each of those writes is an intent row, then the call, then a receipt.</text><text x="24" y="68" font-size="11.5" fill="#9198a1">The analysis VM has no cloud identity and reaches only the model and package indexes.</text><g><rect x="24" y="88" width="128" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="36" y="112" font-weight="600" fill="#e6edf3">Slack</text><text x="36" y="128" font-size="11.5" fill="#9198a1">requests, files,</text><text x="36" y="144" font-size="11.5" fill="#9198a1">replies, notices</text></g><g><rect x="170" y="88" width="128" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="182" y="112" font-weight="600" fill="#e6edf3">GitHub</text><text x="182" y="128" font-size="11.5" fill="#9198a1">analysis PRs,</text><text x="182" y="144" font-size="11.5" fill="#9198a1">incident issues</text></g><g><rect x="316" y="88" width="128" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="328" y="112" font-weight="600" fill="#e6edf3">Data sources</text><text x="328" y="128" font-size="11.5" fill="#9198a1">catalogs,</text><text x="328" y="144" font-size="11.5" fill="#9198a1">storage buckets</text></g><g><rect x="462" y="88" width="128" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="474" y="112" font-weight="600" fill="#e6edf3">Anthropic</text><text x="474" y="128" font-size="11.5" fill="#9198a1">Claude Opus 5.5,</text><text x="474" y="144" font-size="11.5" fill="#9198a1">findings only</text></g><g><rect x="608" y="88" width="128" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="620" y="112" font-weight="600" fill="#e6edf3">OpenAI</text><text x="620" y="128" font-size="11.5" fill="#9198a1">Agents API,</text><text x="620" y="144" font-size="11.5" fill="#9198a1">gpt-6.1-sol</text></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M88 160V200" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M234 160V200" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M380 160V200" marker-end="url(#arch-arrow)"></path><path d="M526 160V200" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M672 160V200" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path></g><text x="388" y="184" font-size="11.5" fill="#9198a1">read only</text><g><rect x="24" y="200" width="712" height="318" rx="8" fill="rgba(110, 118, 129, 0.18)" stroke="#6e7681" stroke-width="1.25"></rect><text x="40" y="222" font-weight="600" fill="#e6edf3">Control plane: six services on a private network, one identity each</text><text x="40" y="238" font-size="11.5" fill="#9198a1">A scheduler calls each service every minute. Each claims its work with a lease.</text></g><g><rect x="40" y="254" width="216" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="52" y="278" font-weight="600" fill="#e6edf3">Ingress</text><text x="52" y="294" font-size="11.5" fill="#9198a1">checks Slack signatures,</text><text x="52" y="310" font-size="11.5" fill="#9198a1">answers fast, queues the work</text></g><g><rect x="272" y="254" width="216" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="284" y="278" font-weight="600" fill="#e6edf3">Scientist</text><text x="284" y="294" font-size="11.5" fill="#9198a1">one agent per Slack thread;</text><text x="284" y="310" font-size="11.5" fill="#9198a1">browses data, starts analyses</text></g><g><rect x="504" y="254" width="216" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="516" y="278" font-weight="600" fill="#e6edf3">Worker</text><text x="516" y="294" font-size="11.5" fill="#9198a1">delivers Slack messages</text><text x="516" y="310" font-size="11.5" fill="#9198a1">at most once, via the ledger</text></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M148 326V350"></path><path d="M380 326V350"></path><path d="M612 326V350"></path><path d="M148 406V430"></path><path d="M380 406V430"></path><path d="M612 406V430"></path></g><g><rect x="40" y="350" width="680" height="56" rx="8" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-width="2"></rect><text x="52" y="374" font-weight="600" fill="#e6edf3">Database: the ledger</text><text x="52" y="390" font-size="11.5" fill="#e6edf3">intents and receipts for every outside write, leases, uncertain writes, audit events, incidents</text></g><g><rect x="40" y="430" width="216" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="52" y="454" font-weight="600" fill="#e6edf3">Bootstrap</text><text x="52" y="470" font-size="11.5" fill="#9198a1">pins inputs by checksum,</text><text x="52" y="486" font-size="11.5" fill="#9198a1">launches the VM, sends files</text></g><g><rect x="272" y="430" width="216" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="284" y="454" font-weight="600" fill="#e6edf3">Publisher</text><text x="284" y="470" font-size="11.5" fill="#9198a1">runs the rerun and the review,</text><text x="284" y="486" font-size="11.5" fill="#9198a1">opens and updates the PR</text></g><g><rect x="504" y="430" width="216" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="516" y="454" font-weight="600" fill="#e6edf3">Supervisor</text><text x="516" y="470" font-size="11.5" fill="#9198a1">proves every VM stopped,</text><text x="516" y="486" font-size="11.5" fill="#9198a1">health snapshot every minute</text></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M148 502V574" marker-end="url(#arch-arrow)"></path><path d="M380 502V574" marker-end="url(#arch-arrow)"></path></g><text x="156" y="542" font-size="11.5" fill="#9198a1">SSH: launch, files, data tokens</text><text x="388" y="542" font-size="11.5" fill="#9198a1">SSH: rerun, collect</text><g><rect x="24" y="558" width="496" height="216" rx="8" fill="rgba(110, 118, 129, 0.18)" stroke="#6e7681" stroke-width="1.25"></rect><text x="40" y="742" font-weight="600" fill="#e6edf3">Analysis VM, one per run</text><text x="40" y="758" font-size="11.5" fill="#9198a1">no cloud identity or public address; stops itself at its deadline</text></g><g><rect x="40" y="574" width="464" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="52" y="598" font-weight="600" fill="#e6edf3">Host helper (root)</text><text x="52" y="614" font-size="11.5" fill="#9198a1">the only way in (SSH, forced command); writes the receipts</text></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M152 630V646" marker-end="url(#arch-arrow)"></path><path d="M392 630V646" marker-end="url(#arch-arrow)"></path></g><g><rect x="40" y="646" width="224" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="52" y="670" font-weight="600" fill="#e6edf3">Verifier container</text><text x="52" y="686" font-size="11.5" fill="#9198a1">reruns the notebook from the</text><text x="52" y="702" font-size="11.5" fill="#9198a1">same inputs, no data network</text></g><g><rect x="280" y="646" width="224" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="292" y="670" font-weight="600" fill="#e6edf3">Analysis container</text><text x="292" y="686" font-size="11.5" fill="#9198a1">agent writes and runs the</text><text x="292" y="702" font-size="11.5" fill="#9198a1">notebook; inputs read-only</text></g><g><rect x="536" y="646" width="200" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="548" y="670" font-weight="600" fill="#e6edf3">Egress gateway</text><text x="548" y="686" font-size="11.5" fill="#9198a1">hostname allow-list:</text><text x="548" y="702" font-size="11.5" fill="#9198a1">OpenAI API, package indexes</text></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M504 682H536" marker-end="url(#arch-arrow)"></path><path d="M736 682H750V124H736" marker-end="url(#arch-arrow)"></path></g></svg>
