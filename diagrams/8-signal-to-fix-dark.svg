<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 338" role="img" aria-label="Alerts say a category is unhealthy; incidents say what broke" font-size="13"><defs><marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">Alerts say a category is unhealthy; incidents say what broke</text><text x="24" y="86" font-size="11.5" fill="#9198a1">Alerts: a category is unhealthy</text><text x="24" y="216" font-size="11.5" fill="#9198a1">Incidents: what broke</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M184 140H208" marker-end="url(#signal-arrow)"></path><path d="M368 140H392" marker-end="url(#signal-arrow)"></path><path d="M552 140H576" marker-end="url(#signal-arrow)"></path><path d="M184 270H208" marker-end="url(#signal-arrow)"></path><path d="M368 270H392" marker-end="url(#signal-arrow)"></path><path d="M552 270H576" marker-end="url(#signal-arrow)"></path><path d="M170 184V226" stroke-dasharray="4 4" marker-end="url(#signal-arrow)"></path></g><g><rect x="24" y="96" width="160" height="88" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="36" y="120" font-weight="600" fill="#e6edf3">Health snapshot</text><text x="36" y="136" font-size="11.5" fill="#9198a1">every minute: counts</text><text x="36" y="152" font-size="11.5" fill="#9198a1">and ids, no content</text></g><g><rect x="208" y="96" width="160" height="88" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="220" y="120" font-weight="600" fill="#e6edf3">Log-based metrics</text><text x="220" y="136" font-size="11.5" fill="#9198a1">counters, no label</text><text x="220" y="152" font-size="11.5" fill="#9198a1">from any content</text></g><g><rect x="392" y="96" width="160" height="88" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="404" y="120" font-weight="600" fill="#e6edf3">Alert policies</text><text x="404" y="136" font-size="11.5" fill="#9198a1">page on persistence,</text><text x="404" y="152" font-size="11.5" fill="#9198a1">notify obligations,</text><text x="404" y="168" font-size="11.5" fill="#9198a1">heartbeat if silent</text></g><g><rect x="24" y="226" width="160" height="88" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="36" y="250" font-weight="600" fill="#e6edf3">A failure, once</text><text x="36" y="266" font-size="11.5" fill="#9198a1">fingerprint: closure</text><text x="36" y="282" font-size="11.5" fill="#9198a1">reason + error code</text></g><g><rect x="208" y="226" width="160" height="88" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="220" y="250" font-weight="600" fill="#e6edf3">Incident</text><text x="220" y="266" font-size="11.5" fill="#9198a1">one per fingerprint,</text><text x="220" y="282" font-size="11.5" fill="#9198a1">groups affected runs,</text><text x="220" y="298" font-size="11.5" fill="#9198a1">posted + filed once</text></g><g><rect x="392" y="226" width="160" height="88" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="404" y="250" font-weight="600" fill="#e6edf3">Investigator</text><text x="404" y="266" font-size="11.5" fill="#9198a1">reads only what the</text><text x="404" y="282" font-size="11.5" fill="#9198a1">app wrote; daily cap;</text><text x="404" y="298" font-size="11.5" fill="#9198a1">draft PR, path-fenced</text></g><g><rect x="576" y="96" width="160" height="218" rx="8" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-width="2"></rect><text x="656" y="201" text-anchor="middle" font-weight="600" fill="#e6edf3">A person</text><text x="656" y="217" text-anchor="middle" font-size="11.5" fill="#e6edf3">reviews the draft,</text><text x="656" y="233" text-anchor="middle" font-size="11.5" fill="#e6edf3">settles what is stuck</text></g><text x="178" y="209" font-size="11.5" fill="#9198a1">same sweep</text></svg>
