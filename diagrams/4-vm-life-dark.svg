<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 824" role="img" aria-label="Bootstrap builds the VM; only the supervisor stops and deletes it" font-size="13"><defs><marker id="life-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">Bootstrap builds the VM; only the supervisor stops and deletes it</text><g stroke="#30363d" stroke-width="1"><line x1="202" y1="56" x2="202" y2="736"></line><line x1="380" y1="56" x2="380" y2="736"></line><line x1="558" y1="56" x2="558" y2="736"></line></g><text x="113" y="76" text-anchor="middle" font-weight="600" fill="#e6edf3">Bootstrap</text><text x="291" y="76" text-anchor="middle" font-weight="600" fill="#e6edf3">Worker</text><text x="469" y="76" text-anchor="middle" font-weight="600" fill="#e6edf3">Publisher</text><text x="647" y="76" text-anchor="middle" font-weight="600" fill="#e6edf3">Supervisor</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M113 152V168" marker-end="url(#life-arrow)"></path><path d="M113 224V240" marker-end="url(#life-arrow)"></path><path d="M113 296V312" marker-end="url(#life-arrow)"></path><path d="M113 368V384" marker-end="url(#life-arrow)"></path><path d="M188 412H291V456" marker-end="url(#life-arrow)"></path><path d="M366 484H469V528" marker-end="url(#life-arrow)"></path><path d="M544 556H647V600" marker-end="url(#life-arrow)"></path><path d="M647 656V672" marker-end="url(#life-arrow)"></path></g><g><rect x="38" y="96" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="50" y="120" font-weight="600" fill="#e6edf3">Plan and key</text><text x="50" y="136" font-size="11.5" fill="#9198a1">fixed IDs, deadline</text></g><g><rect x="38" y="168" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="50" y="192" font-weight="600" fill="#e6edf3">Stage inputs</text><text x="50" y="208" font-size="11.5" fill="#9198a1">checksums, receipt</text></g><g><rect x="38" y="240" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="50" y="264" font-weight="600" fill="#e6edf3">Create the VM</text><text x="50" y="280" font-size="11.5" fill="#9198a1">no cloud identity</text></g><g><rect x="38" y="312" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="50" y="336" font-weight="600" fill="#e6edf3">Pin the host key</text><text x="50" y="352" font-size="11.5" fill="#9198a1">read via cloud API</text></g><g><rect x="38" y="384" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="50" y="408" font-weight="600" fill="#e6edf3">Session and start</text><text x="50" y="424" font-size="11.5" fill="#9198a1">SSH, forced command</text></g><g><rect x="216" y="456" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="228" y="480" font-weight="600" fill="#e6edf3">Watch the run</text><text x="228" y="496" font-size="11.5" fill="#9198a1">polls every 10 to 30 s</text></g><g><rect x="394" y="528" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="406" y="552" font-weight="600" fill="#e6edf3">Rerun and publish</text><text x="406" y="568" font-size="11.5" fill="#9198a1">sealed output only</text></g><g><rect x="572" y="600" width="150" height="56" rx="8" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-width="2"></rect><text x="584" y="624" font-weight="600" fill="#e6edf3">Stop, verified</text><text x="584" y="640" font-size="11.5" fill="#e6edf3">same numeric ID</text></g><g><rect x="572" y="672" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6e7681" stroke-width="1.25"></rect><text x="584" y="696" font-weight="600" fill="#e6edf3">Purge</text><text x="584" y="712" font-size="11.5" fill="#9198a1">3 days after stop</text></g><g><rect x="24" y="752" width="712" height="48" rx="8" fill="rgba(110, 118, 129, 0.18)" stroke="#6e7681" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="40" y="781" font-weight="600" fill="#e6edf3">Backstop:</text><text x="116" y="781" font-size="11.5" fill="#9198a1">the cloud itself stops the VM at its deadline, even if every service is down</text><path d="M732 752V628H722" fill="none" stroke="#6e7681" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#life-arrow)"></path></g></svg>
