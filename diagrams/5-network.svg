<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 456" role="img" aria-label="The container reaches the gateway, and storage only with a token" font-size="13"><defs><marker id="net-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">The container reaches the gateway, and storage only with a token</text><text x="24" y="52" font-size="11.5" fill="#59636e">Four layers say the same thing: cloud firewall, host firewall, DNS, gateway allow-list.</text><g><rect x="24" y="112" width="152" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="136" font-weight="600" fill="#1f2328">Control plane</text><text x="36" y="152" font-size="11.5" fill="#59636e">SSH in, one command</text><text x="36" y="168" font-size="11.5" fill="#59636e">VM never calls back</text></g><g><rect x="208" y="80" width="296" height="352" rx="8" fill="rgba(140, 149, 159, 0.12)" stroke="#8c959f" stroke-width="1.25"></rect><text x="224" y="102" font-weight="600" fill="#1f2328">Analysis VM</text><text x="224" y="118" font-size="11.5" fill="#59636e">no cloud identity, no public address</text><text x="224" y="208" font-size="11.5" fill="#59636e">host firewall, in place before SSH starts</text><text x="224" y="404" font-size="11.5" fill="#59636e">cloud firewall: egress only to the gateway</text><text x="224" y="420" font-size="11.5" fill="#59636e">and private storage; ingress only SSH</text></g><g><rect x="224" y="132" width="264" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="236" y="156" font-weight="600" fill="#1f2328">Host helper (root)</text><text x="236" y="172" font-size="11.5" fill="#59636e">the only way in; writes receipts</text></g><g><rect x="224" y="220" width="264" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="236" y="244" font-weight="600" fill="#1f2328">Analysis container</text><text x="236" y="260" font-size="11.5" fill="#59636e">unprivileged, read-only root</text><text x="236" y="276" font-size="11.5" fill="#59636e">DNS maps 5 names to the gateway</text></g><g><rect x="224" y="308" width="264" height="72" rx="8" fill="#d1242f" fill-opacity="0.08" stroke="#d1242f" stroke-width="1.25"></rect><text x="236" y="332" font-weight="600" fill="#1f2328">Blocked</text><text x="236" y="348" font-size="11.5" fill="#59636e">host, metadata server, other</text><text x="236" y="364" font-size="11.5" fill="#59636e">containers, IPv6, everything else</text></g><g><rect x="536" y="120" width="200" height="104" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="548" y="144" font-weight="600" fill="#1f2328">Egress gateway</text><text x="548" y="160" font-size="11.5" fill="#59636e">forwards TLS by server name</text><text x="548" y="176" font-size="11.5" fill="#59636e">five names: the model API,</text><text x="548" y="192" font-size="11.5" fill="#59636e">its channel, 3 indexes</text><text x="548" y="208" font-size="11.5" fill="#59636e">no certs, no traffic log</text></g><g><rect x="536" y="312" width="200" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="548" y="336" font-weight="600" fill="#1f2328">Private storage</text><text x="548" y="352" font-size="11.5" fill="#59636e">storage analyses only</text><text x="548" y="368" font-size="11.5" fill="#59636e">read-only token, one hour</text></g><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M176 148H224" marker-end="url(#net-arrow)"></path><path d="M488 248H520V172H536" marker-end="url(#net-arrow)"></path><path d="M488 264H512V348H536" marker-end="url(#net-arrow)"></path></g><text x="200" y="140" text-anchor="middle" font-size="11.5" fill="#59636e">SSH 22</text><text x="526" y="236" font-size="11.5" fill="#59636e">HTTPS 443</text><text x="526" y="300" font-size="11.5" fill="#59636e">private range, 443</text></svg>
