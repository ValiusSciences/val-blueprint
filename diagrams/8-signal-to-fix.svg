<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 338" role="img" aria-label="Alerts say a category is unhealthy; incidents say what broke" font-size="13"><defs><marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Alerts say a category is unhealthy; incidents say what broke</text><text x="24" y="86" font-size="11.5" fill="#59636e">Alerts: a category is unhealthy</text><text x="24" y="216" font-size="11.5" fill="#59636e">Incidents: what broke</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M184 140H208" marker-end="url(#signal-arrow)"></path><path d="M368 140H392" marker-end="url(#signal-arrow)"></path><path d="M552 140H576" marker-end="url(#signal-arrow)"></path><path d="M184 270H208" marker-end="url(#signal-arrow)"></path><path d="M368 270H392" marker-end="url(#signal-arrow)"></path><path d="M552 270H576" marker-end="url(#signal-arrow)"></path><path d="M170 184V226" stroke-dasharray="4 4" marker-end="url(#signal-arrow)"></path></g><g><rect x="24" y="96" width="160" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="120" font-weight="600" fill="#1f2328">Health snapshot</text><text x="36" y="136" font-size="11.5" fill="#59636e">every minute: counts</text><text x="36" y="152" font-size="11.5" fill="#59636e">and ids, no content</text></g><g><rect x="208" y="96" width="160" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="220" y="120" font-weight="600" fill="#1f2328">Log-based metrics</text><text x="220" y="136" font-size="11.5" fill="#59636e">counters, no label</text><text x="220" y="152" font-size="11.5" fill="#59636e">from any content</text></g><g><rect x="392" y="96" width="160" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="404" y="120" font-weight="600" fill="#1f2328">Alert policies</text><text x="404" y="136" font-size="11.5" fill="#59636e">page on persistence,</text><text x="404" y="152" font-size="11.5" fill="#59636e">notify obligations,</text><text x="404" y="168" font-size="11.5" fill="#59636e">heartbeat if silent</text></g><g><rect x="24" y="226" width="160" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="250" font-weight="600" fill="#1f2328">A failure, once</text><text x="36" y="266" font-size="11.5" fill="#59636e">fingerprint: closure</text><text x="36" y="282" font-size="11.5" fill="#59636e">reason + error code</text></g><g><rect x="208" y="226" width="160" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="220" y="250" font-weight="600" fill="#1f2328">Incident</text><text x="220" y="266" font-size="11.5" fill="#59636e">one per fingerprint,</text><text x="220" y="282" font-size="11.5" fill="#59636e">groups affected runs,</text><text x="220" y="298" font-size="11.5" fill="#59636e">posted + filed once</text></g><g><rect x="392" y="226" width="160" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="404" y="250" font-weight="600" fill="#1f2328">Investigator</text><text x="404" y="266" font-size="11.5" fill="#59636e">reads only what the</text><text x="404" y="282" font-size="11.5" fill="#59636e">app wrote; daily cap;</text><text x="404" y="298" font-size="11.5" fill="#59636e">draft PR, path-fenced</text></g><g><rect x="576" y="96" width="160" height="218" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"></rect><text x="656" y="201" text-anchor="middle" font-weight="600" fill="#1f2328">A person</text><text x="656" y="217" text-anchor="middle" font-size="11.5" fill="#1f2328">reviews the draft,</text><text x="656" y="233" text-anchor="middle" font-size="11.5" fill="#1f2328">settles what is stuck</text></g><text x="178" y="209" font-size="11.5" fill="#59636e">same sweep</text></svg>
