<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 760 536" role="img" aria-label="Code ships itself; everything sensitive is staged" font-size="13"><defs><marker id="path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Code ships itself; everything sensitive is staged</text><text x="24" y="50" font-size="11.5" fill="#59636e">Three lanes, three different orders. Nothing in the lower two happens on a merge.</text><g><rect x="24" y="72" width="712" height="136" rx="8" fill="rgba(140, 149, 159, 0.12)" stroke="#8c959f" stroke-width="1.25"></rect><text x="40" y="94" font-weight="600" fill="#1f2328">Control-plane code: a merge deploys itself</text><text x="40" y="110" font-size="11.5" fill="#59636e">the deployer can push images and update its own services, nothing else</text><text x="40" y="196" font-size="11.5" fill="#59636e">deploys the newest green commit, never a target behind production; the manifest is written last</text></g><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M188 152H216" marker-end="url(#path-arrow)"></path><path d="M364 152H392" marker-end="url(#path-arrow)"></path><path d="M540 152H568" marker-end="url(#path-arrow)"></path></g><g><rect x="40" y="124" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="114" y="148" text-anchor="middle" font-weight="600" fill="#1f2328">Merge to main</text><text x="114" y="164" text-anchor="middle" font-size="11.5" fill="#59636e">newest green commit</text></g><g><rect x="216" y="124" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="290" y="148" text-anchor="middle" font-weight="600" fill="#1f2328">Build and migrate</text><text x="290" y="164" text-anchor="middle" font-size="11.5" fill="#59636e">schema forward only</text></g><g><rect x="392" y="124" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="466" y="148" text-anchor="middle" font-weight="600" fill="#1f2328">Roll one by one</text><text x="466" y="164" text-anchor="middle" font-size="11.5" fill="#59636e">refuse a rollback</text></g><g><rect x="568" y="124" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="642" y="148" text-anchor="middle" font-weight="600" fill="#1f2328">Release manifest</text><text x="642" y="164" text-anchor="middle" font-size="11.5" fill="#59636e">digests + commit</text></g><g><rect x="24" y="224" width="712" height="136" rx="8" fill="rgba(140, 149, 159, 0.12)" stroke="#8c959f" stroke-width="1.25"></rect><text x="40" y="246" font-weight="600" fill="#1f2328">Everything else: a staged release</text><text x="40" y="262" font-size="11.5" fill="#59636e">images, gateway, runtime config, policy, secrets, IAM, network: one reviewed scope at a time</text><text x="40" y="348" font-size="11.5" fill="#59636e">automatic deploys are paused for the apply and replayed after; a plan from main must then be a no-op</text></g><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M188 304H216" marker-end="url(#path-arrow)"></path><path d="M364 304H392" marker-end="url(#path-arrow)"></path><path d="M540 304H568" marker-end="url(#path-arrow)"></path></g><g><rect x="40" y="276" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="114" y="300" text-anchor="middle" font-weight="600" fill="#1f2328">Stage the change</text><text x="114" y="316" text-anchor="middle" font-size="11.5" fill="#59636e">intent file first</text></g><g><rect x="216" y="276" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="290" y="300" text-anchor="middle" font-weight="600" fill="#1f2328">Plan, reviewed</text><text x="290" y="316" text-anchor="middle" font-size="11.5" fill="#59636e">exact scope</text></g><g><rect x="392" y="276" width="148" height="56" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"></rect><text x="466" y="300" text-anchor="middle" font-weight="600" fill="#1f2328">Apply that plan</text><text x="466" y="316" text-anchor="middle" font-size="11.5" fill="#1f2328">refuse any drift</text></g><g><rect x="568" y="276" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="642" y="300" text-anchor="middle" font-weight="600" fill="#1f2328">Outcome file</text><text x="642" y="316" text-anchor="middle" font-size="11.5" fill="#59636e">verify the revision</text></g><g><rect x="24" y="376" width="712" height="136" rx="8" fill="rgba(140, 149, 159, 0.12)" stroke="#8c959f" stroke-width="1.25"></rect><text x="40" y="398" font-weight="600" fill="#1f2328">A new policy field: code first, data second, switch third</text><text x="40" y="414" font-size="11.5" fill="#59636e">the policy is a strictly validated, hot-reloaded secret; an unknown field is an error</text><text x="40" y="500" font-size="11.5" fill="#59636e">the switch turns on only after what it needs (images, schedules, credentials) is verified live</text></g><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M188 456H216" marker-end="url(#path-arrow)"></path><path d="M364 456H392" marker-end="url(#path-arrow)"></path></g><g><rect x="40" y="428" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="114" y="452" text-anchor="middle" font-weight="600" fill="#1f2328">Deploy the reader</text><text x="114" y="468" text-anchor="middle" font-size="11.5" fill="#59636e">every service on it</text></g><g><rect x="216" y="428" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="290" y="452" text-anchor="middle" font-weight="600" fill="#1f2328">Import policy</text><text x="290" y="468" text-anchor="middle" font-size="11.5" fill="#59636e">keep the old version</text></g><g><rect x="392" y="428" width="148" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="466" y="452" text-anchor="middle" font-weight="600" fill="#1f2328">Switch on</text><text x="466" y="468" text-anchor="middle" font-size="11.5" fill="#59636e">a separate version</text></g></svg>
